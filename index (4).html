<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار تفاعلي – السنة الثالثة متوسط | العلوم الفيزيائية والتكنولوجيا والرياضيات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#14213d;--mut:#5b6b88;--line:#dde4f0;--chem:#0e9f8e;--math:#5b5bd6;--ok:#16a34a;--bad:#dc2626;--okbg:#e8f8ee;--badbg:#fdecec;--acc:var(--math)}
@media(prefers-color-scheme:dark){:root{--bg:#0d1424;--card:#151e33;--ink:#e8edf8;--mut:#93a1bf;--line:#26324d;--okbg:#10281b;--badbg:#321517;--chem:#2dd4bf;--math:#8b8bf5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.7;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
main{max-width:720px;margin:0 auto}
h1{font-size:clamp(1.5rem,5vw,2.2rem);font-weight:800;margin:.6em 0 .2em}
p.sub{color:var(--mut);margin:0 0 1.2em}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:16px}
.modes{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.mode{font:inherit;text-align:right;cursor:pointer;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:16px}
.mode b{display:block;font-size:1.15rem}.mode span{color:var(--mut);font-size:.9rem}
.mode:hover,.mode:focus-visible{border-color:var(--c);outline:none}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .35s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin-bottom:6px}
.tag{font-weight:600;color:var(--acc)}
.q{font-size:1.2rem;font-weight:600;margin:.4em 0 1em}
.opts{display:grid;gap:10px}
.opt{font:inherit;text-align:right;cursor:pointer;background:transparent;color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px 16px}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.no{border-color:var(--bad);background:var(--badbg)}
.eq{direction:ltr;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;font-size:1.25rem;margin:1em 0}
.eq input{width:3.2rem;height:2.6rem;text-align:center;font:inherit;font-size:1.1rem;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px}
.eq input.ok{border-color:var(--ok);background:var(--okbg)}.eq input.no{border-color:var(--bad);background:var(--badbg)}
.eq .t{white-space:nowrap}
.ans{display:flex;gap:10px}
.ans input{flex:1;font:inherit;font-size:1.1rem;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);direction:ltr;text-align:center}
.btn{font:inherit;font-weight:600;cursor:pointer;background:var(--acc);color:#fff;border:0;border-radius:12px;padding:11px 22px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.fb{margin-top:14px;padding:12px 16px;border-radius:14px;display:none}
.fb.ok{display:block;background:var(--okbg);border-right:5px solid var(--ok)}
.fb.no{display:block;background:var(--badbg);border-right:5px solid var(--bad)}
.nav{display:flex;justify-content:flex-end;margin-top:16px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;line-height:1.25;direction:ltr}
.fr i{font-style:normal;padding:0 4px}.fr i:first-child{border-bottom:2px solid currentColor}
.ltr{direction:ltr;unicode-bidi:isolate}
.score{font-size:3.4rem;font-weight:800;text-align:center;color:var(--acc);margin:.1em 0}
.rev{display:grid;gap:6px;margin:14px 0}
.rev div{padding:8px 12px;border-radius:10px;background:var(--bg);font-size:.95rem}
.rev .g{border-right:4px solid var(--ok)}.rev .w{border-right:4px solid var(--bad)}
.hide{display:none}.gov{text-align:center;font-size:.85rem;color:var(--mut);border-bottom:2px solid var(--line);padding-bottom:10px;margin-bottom:6px}.gov b{display:block;color:var(--ink);font-size:.95rem}.lv{display:inline-block;background:var(--acc);color:#fff;border-radius:10px;padding:2px 12px;font-weight:600;font-size:.9rem}.nm{width:100%;font:inherit;padding:10px 14px;margin-bottom:14px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}.foot{text-align:center;color:var(--mut);margin-top:24px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="gov"><b>الجمهورية الجزائرية الديمقراطية الشعبية</b>وزارة التربية الوطنية</div>
  <h1>تحضير فرض الفصل الأول</h1>
  <p class="sub"><span class="lv">السنة الثالثة متوسط</span> &nbsp;العلوم الفيزيائية والتكنولوجيا – الرياضيات. التقييم على 20 كما في الفروض.</p>
  <section id="home" class="card">
    <input id="nm" class="nm" placeholder="الاسم واللقب (اختياري)" autocomplete="name">
    <p style="margin-top:0;font-weight:600">اختر المادة</p>
    <div class="modes">
      <button class="mode" style="--c:var(--chem)" data-m="chem"><b>العلوم الفيزيائية</b><span>التحول الكيميائي، الأنواع والأفراد، موازنة المعادلات</span></button>
      <button class="mode" style="--c:var(--math)" data-m="math"><b>الرياضيات</b><span>الأعداد النسبية، مقارنة الكسور وحساباتها</span></button>
      <button class="mode" style="--c:var(--ink)" data-m="all"><b>اختبار شامل</b><span>كل الأسئلة معًا</span></button>
    </div>
  </section>
  <section id="quiz" class="card hide">
    <div class="meta"><span id="tag" class="tag"></span><span id="cnt"></span></div>
    <div class="bar"><i id="pb"></i></div>
    <div id="q" class="q"></div>
    <div id="body"></div>
    <div id="fb" class="fb" role="status" aria-live="polite"></div>
    <div class="nav"><button id="next" class="btn hide">التالي</button></div>
  </section>
  <section id="end" class="card hide"></section>
<p class="foot">بالتوفيق للجميع</p></main>
<script>
const F=s=>s.replace(/\{(-?\d+)\/(\d+)\}/g,'<span class="fr"><i>$1</i><i>$2</i></span>');
const sub=s=>s.replace(/([A-Za-z\)])(\d+)/g,'$1<sub>$2</sub>');
const B=(r,p,a,st)=>({k:'chem',t:'bal',r,p,a,st,q:'وازن المعادلة الكيميائية التالية (اترك الخانة فارغة إذا كان المعامل 1):'});
const M=(q,o,c,e,k='math')=>({k,t:'mcq',q,o,c,e});
const N=(q,a,e,k='math')=>({k,t:'num',q,a:[].concat(a),e});
const CMP=(a,b,c,e)=>M(`ضع الرمز المناسب: ${a} … ${b}`,['>','<','='],c,e);
const Q=[
// ---- الفيزياء
M('في التحليل الكهربائي للماء، لماذا نضيف الصودا (هيدروكسيد الصوديوم)؟',['لتغيير لون الماء','لجعل المحلول ناقلًا للتيار الكهربائي','لتبريد المحلول','لتسريع تبخر الماء'],1,'الماء النقي ضعيف التوصيل، والصودا تجعله محلولًا شاردياً يوصل التيار ويسمى «الإلكتروليت».','chem'),
M('الأفراد الكيميائية (مجهريًا) للمتفاعل في التحليل الكهربائي للماء هي:',['جزيئات H₂O','ذرات O وذرات H منفصلة','جزيئات O₂ فقط','شوارد Na⁺ فقط'],0,'المتفاعل هو الماء، أي جزيئات H₂O.','chem'),
M('الأنواع الكيميائية الناتجة عن التحليل الكهربائي للماء هي:',['غاز الأكسجين وغاز الهيدروجين','غاز الأكسجين وغاز الآزوت','الهيدروجين والصودا','CO₂ وH₂O'],0,'ينتج غاز الأكسجين O₂ وغاز الهيدروجين H₂.','chem'),
M('في الكتابة الرمزية للتفاعل: ماذا يعني الرمز (aq) بجانب الصيغة؟',['صلب','سائل','غاز','محلول مائي'],3,'(s) صلب، (l) سائل، (g) غاز، (aq) محلول مائي.','chem'),
M('كيف نكشف عن غاز الهيدروجين H₂ الناتج عن التحليل الكهربائي للماء؟',['يشعل جمرة متوهجة','يحدث فرقعة عند تقريب لهب منه','يعكّر رائق الكلس','يحمّر ورقة عباد الشمس'],1,'غاز H₂ يحدث فرقعة بوجود لهب، أما O₂ فيعيد اشتعال جمرة متوهجة.','chem'),
M('أي نوع يمثل «الفرد الكيميائي» للمادة (النوع الكيميائي) غاز الأكسجين؟',['ذرة O','جزيئة O₂','شاردة O²⁻','جزيئة O₃'],1,'غاز الأكسجين نوع كيميائي (عيانيًا) وفرده الكيميائي (مجهريًا) هو الجزيئة O₂.','chem'),
M('أثناء التحول الكيميائي، ما الذي ينحفظ؟',['عدد الجزيئات','الأنواع الكيميائية','الكتلة وعدد الذرات من كل نوع','الحالة الفيزيائية'],2,'تنحفظ الكتلة وعدد الذرات من كل عنصر، ولهذا نوازن المعادلة.','chem'),
B(['H2O(l)'],['H2(g)','O2(g)'],[2,2,1],'2H₂O → 2H₂ + O₂'),
B(['Fe','HCl'],['FeCl2','H2'],[1,2,1,1],'Fe + 2HCl → FeCl₂ + H₂'),
B(['CuO','C'],['CO2','Cu'],[2,1,1,2],'2CuO + C → CO₂ + 2Cu'),
M('في تلحيم السكك الحديدية: نسخن مزيجًا من الألمنيوم Al وأكسيد الحديد الثلاثي Fe₂O₃. ما هي المتفاعلات؟',['Al₂O₃ و Fe','Al و Fe₂O₃','Al و Fe','Fe₂O₃ و Fe'],1,'المتفاعلات هي Al وFe₂O₃، والنواتج Al₂O₃ وFe (الحديد السائل).','chem'),
B(['Al','Fe2O3'],['Al2O3','Fe'],[2,1,1,2],'2Al + Fe₂O₃ → Al₂O₃ + 2Fe'),
B(['CH4','O2'],['CO2','H2O'],[1,2,1,2],'CH₄ + 2O₂ → CO₂ + 2H₂O'),
B(['C3H8','O2'],['CO2','H2O'],[1,5,3,4],'C₃H₈ + 5O₂ → 3CO₂ + 4H₂O'),
B(['Zn','O2'],['ZnO'],[2,1,2],'2Zn + O₂ → 2ZnO'),
B(['SO2','O2'],['SO3'],[2,1,2],'2SO₂ + O₂ → 2SO₃'),
B(['Al','O2'],['Al2O3'],[4,3,2],'4Al + 3O₂ → 2Al₂O₃'),
B(['N2','H2'],['NH3'],[1,3,2],'N₂ + 3H₂ → 2NH₃'),
B(['N2','Mg'],['Mg3N2'],[1,3,1],'N₂ + 3Mg → Mg₃N₂'),
B(['Fe','O2'],['Fe2O3'],[4,3,2],'4Fe + 3O₂ → 2Fe₂O₃'),
B(['FeS2','O2'],['Fe2O3','SO2'],[4,11,2,8],'4FeS₂ + 11O₂ → 2Fe₂O₃ + 8SO₂'),
B(['KClO3'],['KCl','O2'],[2,2,3],'2KClO₃ → 2KCl + 3O₂'),
B(['Fe','H2O'],['Fe3O4','H2'],[3,4,1,4],'3Fe + 4H₂O → Fe₃O₄ + 4H₂'),
// ---- الرياضيات
CMP('{3/7}','{5/7}',1,'نفس المقام، نقارن البسطين: 3 < 5.'),
CMP('{2/9}','{2/5}',1,'نفس البسط، الكسر ذو المقام الأكبر هو الأصغر: {2/9} < {2/5}.'),
CMP('{-2/5}','{1/3}',1,'العدد السالب أصغر من الموجب.'),
CMP('{-3/7}','{-5/7}',0,'-3 > -5 والمقامان متساويان.'),
CMP('{5/8}','{3/4}',1,'{5/8} و{6/8}: 5 < 6.'),
M('قارن باستعمال الضرب التبادلي: {2/3} … {3/4}',['>','<','='],1,'2×4 = 8 و 3×3 = 9، إذن 8 < 9 أي {2/3} < {3/4}.'),
M('قارن: {5/6} … {7/9}',['>','<','='],0,'5×9 = 45 و 6×7 = 42، 45 > 42 إذن {5/6} > {7/9}.'),
M('قارن: {3/5} … {7/10}',['>','<','='],1,'3×10 = 30 و 5×7 = 35 إذن {3/5} < {7/10}.'),
M('رتب تصاعديًا: {1/2} ، {3/4} ، {2/5}',['{2/5} < {1/2} < {3/4}','{1/2} < {2/5} < {3/4}','{3/4} < {1/2} < {2/5}'],0,'على المقام 20: {10/20} ، {15/20} ، {8/20}.'),
M('رتب تنازليًا: {2/7} ، {5/7} ، {3/7}',['{5/7} > {3/7} > {2/7}','{2/7} > {3/7} > {5/7}','{3/7} > {5/7} > {2/7}'],0,'المقامات متساوية، نرتب البسوط من الأكبر للأصغر.'),
M('رتب تصاعديًا: {-1/3} ، {1/4} ، {-2/3}',['{-1/3} < {-2/3} < {1/4}','{-2/3} < {-1/3} < {1/4}','{1/4} < {-1/3} < {-2/3}'],1,'السالبان أولًا: {-2/3} < {-1/3}، ثم الموجب {1/4}.'),
M('قارن: {-5/6} … {-3/4}',['>','<','='],1,'على المقام 12: {-10/12} و{-9/12}، و -10 < -9.'),
M('هل العبارة صحيحة؟ {-2/3} > {-3/4}',['صحيحة','خاطئة'],0,'{-8/12} > {-9/12} لأن -8 > -9.'),
M('ما إشارة A = (+2) × (−1) × (1) × (−3) ؟',['موجبة','سالبة','معدومة'],0,'عدد العوامل السالبة 2 (زوجي) فالجداء موجب، و A = 6.'),
N('احسب B = ((−5) × (−2)) ÷ ((−2) × (1))','-5','البسط 10 والمقام -2، إذن B = -5.'),
N('احسب A = (−15) ÷ (+3) × (−4) + (−7) × (+5)','-15','(-5)×(-4) = 20 ثم 20 + (-35) = -15.'),
N('احسب B = [(−8) × (+6) × (−3)] ÷ [(+4) × (−12)]','-3','البسط 144 والمقام -48، إذن B = -3.'),
N('احسب C = {7/15} − {5/12} + ({-1/20}) واكتب النتيجة في أبسط شكل','0','على المقام 60: {28/60} − {25/60} − {3/60} = 0.'),
N('احسب D = ({3/4} − {5/6}) ÷ ({2/3} + {1/2}) واكتب النتيجة كسرًا مبسطًا (مثال: 1/2)','-1/14','{-1/12} ÷ {7/6} = {-1/12} × {6/7} = {-1/14}. المقام 14 يحتوي العامل 7، فهو ليس عددًا عشريًا.'),
N('احسب D = {5/3} + {4/3} × {-3/3}','1/3','{4/3} × (-1) = {-4/3} ثم {5/3} − {4/3} = {1/3}.'),
N('احسب E = ({7/2} − {7/3}) ÷ {4/6} واكتب النتيجة كسرًا مبسطًا','7/4','{7/6} × {6/4} = {7/4}. وهو عدد عشري = 1.75.'),
M('سباق دراجات طوله 150 km: المرحلة الأولى {3/10} من الإجمالي والثانية {7/15}. أيهما أطول؟',['الأولى','الثانية','متساويتان'],1,'على المقام 30: {9/30} < {14/30}.'),
N('في نفس السباق، أي كسر يمثل المرحلة الثالثة؟ (مبسطًا)','7/30','1 − {9/30} − {14/30} = {7/30}.'),
N('استهلك متسابق {3/5} من قارورة سعتها {2/3} L. كم لترًا استهلك؟ (كسر مبسط)','2/5','{3/5} × {2/3} = {6/15} = {2/5} L.'),
N('ما المسافة (بالكيلومتر) للمرحلة الثانية من السباق؟','70','{7/15} × 150 = 70 km.'),
];
const $=id=>document.getElementById(id);
const norm=s=>s.trim().replace(/\s+/g,'').replace('−','-').replace(',','.');
let L,i,score,res;
function start(m){L=Q.filter(q=>m==='all'||q.k===m);i=0;score=0;res=[];
 ['home','end'].forEach(x=>$(x).classList.add('hide'));$('quiz').classList.remove('hide');show();}
function show(){const q=L[i],b=$('body');
 document.documentElement.style.setProperty('--acc',q.k==='chem'?'var(--chem)':'var(--math)');
 $('tag').textContent=q.k==='chem'?'العلوم الفيزيائية':'الرياضيات';
 $('cnt').textContent=`${i+1} / ${L.length}`;$('pb').style.width=(i/L.length*100)+'%';
 $('q').innerHTML=F(q.q);$('fb').className='fb';$('next').classList.add('hide');b.innerHTML='';
 if(q.t==='mcq'){const d=document.createElement('div');d.className='opts';
  q.o.forEach((o,j)=>{const x=document.createElement('button');x.className='opt';x.innerHTML=F(o);x.onclick=()=>check(j===q.c,q,d);d.append(x)});b.append(d);}
 else if(q.t==='num'){b.innerHTML='<div class="ans"><input id="a" inputmode="text" autocomplete="off" aria-label="الإجابة"><button class="btn" id="ok">تحقق</button></div>';
  const go=()=>{const v=norm($('a').value);if(!v)return;check(q.a.map(norm).includes(v),q)};$('ok').onclick=go;$('a').onkeydown=e=>e.key==='Enter'&&go();$('a').focus();}
 else{const n=q.r.length+q.p.length;let h='<div class="eq">',k=0;
  const term=(f)=>`<input inputmode="numeric" data-k="${k++}" aria-label="معامل ${f}"><span class="t">${sub(f)}</span>`;
  h+=q.r.map(term).join('<span>+</span>')+'<span>→</span>'+q.p.map(term).join('<span>+</span>')+'</div><button class="btn" id="ok">تحقق</button>';
  b.innerHTML=h;b.querySelector('input').focus();
  $('ok').onclick=()=>{const ins=[...b.querySelectorAll('input')];let all=true;
   ins.forEach((x,j)=>{const v=x.value.trim()===''?1:+x.value;const g=v===q.a[j];all=all&&g;x.className=g?'ok':'no';x.disabled=true});check(all,q)};}
}
function check(ok,q,d){
 if(d)[...d.children].forEach((x,j)=>{x.disabled=true;if(j===q.c)x.classList.add('ok');else if(x===event.currentTarget)x.classList.add('no')});
 const a=$('ok');if(a)a.disabled=true;const inp=$('a');if(inp)inp.disabled=true;
 if(ok)score++;res.push([ok,q]);
 const f=$('fb');f.className='fb '+(ok?'ok':'no');
 const ans=q.t==='bal'?`<div class="ltr">${q.e}</div>`:F(q.e);
 f.innerHTML=(ok?'<b>إجابة صحيحة!</b> ':'<b>ليست صحيحة.</b> ')+ans;
 const n=$('next');n.textContent=i===L.length-1?'النتيجة':'التالي';n.classList.remove('hide');n.focus();}
$('next').onclick=()=>{i++;i<L.length?show():finish()};
function finish(){$('quiz').classList.add('hide');const e=$('end');e.classList.remove('hide');
 const n20=(score/L.length*20).toFixed(1).replace('.0',''),p=score/L.length*100,nm=$('nm').value.trim();
 const msg=(nm?nm+': ':'')+(p>=80?'ممتاز! عمل رائع.':p>=50?'نتيجة حسنة، راجع الأخطاء وأعد المحاولة.':'تحتاج إلى مزيد من المراجعة، أعد المحاولة بعد مراجعة الدرس.');
 e.innerHTML=`<div class="score"><span class="ltr">${n20} / 20</span></div><p style="text-align:center;color:var(--mut);margin:0">${score} إجابة صحيحة من ${L.length}</p><p style="text-align:center;margin:0">${msg}</p>
